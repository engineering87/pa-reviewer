<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 396 96" width="396" height="96" role="img" aria-label="pa-reviewer">
  <title>pa-reviewer</title>

  <defs>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B6FD4"/>
      <stop offset="1" stop-color="#0A4FA3"/>
    </linearGradient>
  </defs>

  <!-- marchio: parentesi angolari che racchiudono un sigillo di verifica -->
  <g fill="none" stroke="#0A4FA3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 24 L14 48 L30 72"/>
    <path d="M66 24 L82 48 L66 72"/>
  </g>

  <!-- sigillo dentellato -->
  <g transform="translate(48 48)">
    <path fill="url(#seal)" d="
      M0 -19 L4.6 -17.4 L9.5 -16.5 L12.3 -12.3 L16.5 -9.5 L17.4 -4.6 L19 0
      L17.4 4.6 L16.5 9.5 L12.3 12.3 L9.5 16.5 L4.6 17.4 L0 19
      L-4.6 17.4 L-9.5 16.5 L-12.3 12.3 L-16.5 9.5 L-17.4 4.6 L-19 0
      L-17.4 -4.6 L-16.5 -9.5 L-12.3 -12.3 L-9.5 -16.5 L-4.6 -17.4 Z"/>
    <path d="M-7.5 0.5 L-2.4 6 L8 -6" fill="none" stroke="#FFFFFF"
          stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Titillium Web','Segoe UI',system-ui,-apple-system,sans-serif">
    <text x="104" y="52" font-size="30" font-weight="700" fill="#0A2B4E" letter-spacing="-0.4">
      pa<tspan fill="#1B6FD4">-</tspan>reviewer
    </text>
    <text x="106" y="72" font-size="12.5" font-weight="400" fill="#5A6B7D" letter-spacing="0.9">
      REVISIONE DEL CODICE PER LA PA ITALIANA
    </text>
  </g>
</svg>
