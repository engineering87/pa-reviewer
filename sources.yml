# Registro delle fonti normative e tecniche
#
# UNICA fonte di verita' del progetto per i riferimenti normativi.
# NORMATIVE_BASELINE.md e' generato da questo file; non modificare la tabella a mano.
#
# Regola di ammissione: una fonte entra in questo registro solo se e' pubblicamente
# accessibile a un terzo senza credenziali, senza rapporti contrattuali e senza
# conoscenza interna di alcuna organizzazione.
#
# Livelli di verifica:
#   verified   - documento o pagina primaria consultata direttamente; l'affermazione
#                associata e' attestata da quella pagina
#   cited      - riferimento riportato da una fonte secondaria attendibile; la fonte
#                primaria non e' stata ancora consultata
#   unverified - segnaposto di perimetro; nessun controllo attivo puo' basarsi su di esso

schema_version: "0.1.0"
baseline_date: "2026-08-12"
maintainer_note: >
  Le date "retrieved" indicano l'ultima verifica effettiva della fonte, non la data
  di pubblicazione del documento. Una fonte con retrieved piu' vecchio di 180 giorni
  viene segnalata dal controllo di freschezza in CI.

domains:

  # ---------------------------------------------------------------- accessibilita'
  - id: ACC
    name: Accessibilita'
    module: accessibilita
    maturity: stub
    sources:
      - id: ACC-LG-EAA
        document: "Linee Guida sull'accessibilita' dei servizi in attuazione dell'articolo 21 del d.lgs. 82/2022"
        issuer: AgID
        act: "Determinazione n. 38/2026"
        act_date: "2026-03-04"
        status: in_vigore
        url: "https://www.agid.gov.it/sites/agid/files/2026-03/Linee_Guida_accessibilit%C3%A0_dei_servizi_(EAA).pdf"
        verification: verified
        retrieved: "2026-08-12"
        notes: >
          Attua la Direttiva UE 2019/882 (European Accessibility Act). Contiene schede
          di controllo differenziate per siti web, documenti non web e app mobili, e un
          allegato sulle informazioni relative ai servizi che soddisfano i requisiti.
          Da verificare sul PDF il numero esatto e la struttura delle schede prima di
          derivarne regole.

      - id: ACC-EN301549
        document: "EN 301 549 v3.2.1 (2021-03) - Requisiti di accessibilita' per prodotti e servizi ICT"
        issuer: CEN/CENELEC/ETSI
        act: "UNI CEI EN 301549:2021"
        act_date: "2021-03-01"
        status: in_vigore
        url: "https://www.agid.gov.it/sites/agid/files/2026-03/Linee_Guida_accessibilit%C3%A0_dei_servizi_(EAA).pdf"
        verification: cited
        retrieved: "2026-08-12"
        review_by: "2026-11-30"
        notes: >
          Norma armonizzata di riferimento richiamata da ACC-LG-EAA. Fonti secondarie
          indicano un aggiornamento atteso a luglio 2026 con enforcement europeo entro
          novembre 2026, che sposterebbe il riferimento web alle WCAG 2.2 AA.
          NON e' stato verificato se l'aggiornamento sia avvenuto: verificare prima di
          rilasciare il modulo accessibilita' come stable.

      - id: ACC-WCAG21
        document: "Web Content Accessibility Guidelines 2.1, livello AA"
        issuer: W3C
        act: "W3C Recommendation"
        act_date: "2018-06-05"
        status: in_vigore
        url: "https://www.w3.org/TR/WCAG21/"
        verification: cited
        retrieved: "2026-08-12"
        notes: >
          Soglia minima obbligatoria secondo ACC-LG-EAA. WCAG 2.2 raccomandate ma non
          obbligatorie fino all'aggiornamento della norma armonizzata.

      - id: ACC-L4-2004
        document: "Legge 9 gennaio 2004, n. 4 (Legge Stanca)"
        issuer: Parlamento italiano
        act: "L. 4/2004"
        act_date: "2004-01-09"
        status: in_vigore
        url: "https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:legge:2004-01-09;4"
        verification: unverified
        retrieved: "2026-08-12"
        notes: >
          Regime parallelo all'EAA per la PA. Comporta obblighi documentali (dichiarazione
          di accessibilita' e obiettivi annuali via Form AgID) NON verificabili in code
          review: rientrano nel perimetro dei promemoria di adempimento, mai nei finding.
          URL da confermare.

