  # ---------------------------------------------------------------- interoperabilita'
  - id: INT
    name: Interoperabilita' e API
    module: interoperabilita
    maturity: stub
    sources:
      - id: INT-MODI
        document: "Linee guida del modello di interoperabilita' per la Pubblica Amministrazione (ModI)"
        issuer: AgID
        act: "adottate ai sensi dell'art. 71 CAD"
        act_date: null
        status: in_vigore
        url: "https://github.com/italia/api-oas-checker-rules"
        verification: cited
        retrieved: "2026-08-12"
        notes: >
          Estremi della determinazione di adozione e versione vigente da reperire.
          Riferimento normativo di secondo livello: art. 73 CAD.

      - id: INT-OAS-CHECKER
        document: "api-oas-checker-rules - regole Spectral per la verifica delle API secondo il ModI"
        issuer: Dipartimento per la trasformazione digitale
        license: AGPL
        status: in_vigore
        url: "https://github.com/italia/api-oas-checker-rules"
        tool_url: "https://github.com/italia/api-oas-checker"
        verification: verified
        retrieved: "2026-08-12"
        delegation: true
        notes: >
          STRUMENTO DETERMINISTICO UFFICIALE. La skill lo invoca, non lo replica.
          Per la pubblicazione di una OpenAPI nel Catalogo API della PDND l'Ente e' tenuto
          a eseguire il checker con il profilo "Italian Guidelines Full" ottenendo 0 errori.
          Profili disponibili: Italian Guidelines Full, Best Practices Only,
          Extra Security Checks. Disponibile anche come GitHub Action che scarica sempre
          l'ultimo ruleset pubblicato.
          Il progetto dichiara esplicitamente di non essere uno strumento di certificazione:
          la piena conformita' al ModI richiede considerazioni non validabili automaticamente.
          Questo e' lo spazio residuo in cui opera la skill.

  # ---------------------------------------------------------------- riuso
  - id: RIU
    name: Riuso e rilascio open source
    module: riuso
    maturity: beta
    sources:
      - id: RIU-CAD-68-69
        document: "Codice dell'Amministrazione Digitale, articoli 68 e 69"
        issuer: Parlamento italiano
        act: "D.Lgs. 7 marzo 2005, n. 82"
        act_date: "2005-03-07"
        status: in_vigore
        url: "https://docs.italia.it/italia/developers-italia/lg-acquisizione-e-riuso-software-per-pa-docs/it/stabile/premessa/titolarita.html"
        verification: verified
        retrieved: "2026-08-12"
        notes: >
          Art. 69 comma 1: le PA titolari di soluzioni e programmi informatici realizzati
          su specifiche indicazioni del committente pubblico hanno l'obbligo di rendere
          disponibile il codice sorgente, completo della documentazione e rilasciato in
          repertorio pubblico sotto licenza aperta.

      - id: RIU-LG-SW
        document: "Linee guida su acquisizione e riuso di software per le pubbliche amministrazioni"
        issuer: AgID
        act: "in attuazione degli artt. 68 e 69 CAD"
        act_date: null
        status: in_vigore
        url: "https://docs.italia.it/italia/developers-italia/lg-acquisizione-e-riuso-software-per-pa-docs/it/stabile/"
        verification: verified
        retrieved: "2026-08-12"
        notes: >
          Il par. 3.5.3 definisce l'albero decisionale per la scelta della licenza aperta;
          la licenza va scelta tra quelle certificate da Open Source Initiative. Gli allegati
          A, B e D adottano la convenzione MUST/SHOULD e sono pensati per essere allegati a
          un capitolato tecnico. Estremi della determinazione di adozione da reperire.

      - id: RIU-PUBLICCODE-SCHEMA
        document: "Lo Standard publiccode.yml - schema e estensioni nazionali"
        issuer: Developers Italia
        status: in_vigore
        url: "https://docs.italia.it/italia/developers-italia/publiccodeyml/it/master/schema.it.html"
        url_country_extension: "https://docs.italia.it/italia/developers-italia/publiccodeyml/it/master/country.html"
        verification: verified
        retrieved: "2026-08-12"
        notes: >
          L'estensione nazionale italiana espone chiavi autodichiarate: conformita' alle
          linee guida sull'interoperabilita' (rif. art. 73 CAD), conformita' alle Misure
          minime di sicurezza ICT, rispetto del GDPR, interfacciamento con SPID, CIE, ANPR
          e pagoPA, oltre al codice IPA dell'amministrazione.
          NUCLEO DEL PROGETTO: queste chiavi sono AUTODICHIARAZIONI. Il parser ufficiale
          ne verifica la forma, non la verita'. La verifica della loro corrispondenza al
          codice e' il primo modulo stable della skill.

      - id: RIU-PUBLICCODE-PARSER
        document: "publiccode-parser-go - parser e validatore"
        issuer: Developers Italia
        status: in_vigore
        url: "https://github.com/italia/publiccode-parser-go"
        action_url: "https://github.com/italia/publiccode-parser-action"
        action_license: "EUPL-1.2"
        verification: verified
        retrieved: "2026-08-12"
        delegation: true
        supported_versions: ["0", "0.2", "0.2.0", "0.2.1", "0.2.2", "0.3", "0.3.0",
                             "0.4", "0.4.0", "0.5", "0.5.0", "0.7", "0.7.0"]
        notes: >
          STRUMENTO DETERMINISTICO UFFICIALE. Esegue validazione sintattica e semantica
          secondo la specifica ufficiale, con supporto per l'estensione italiana.
          Disponibile come binario, immagine Docker, GitHub Action, snippet GitLab CI e
          orb CircleCI. La skill lo invoca e ne cita l'output; non lo replica.
          Le versioni dello standard accettate sono quelle elencate in supported_versions,
          rilevate direttamente dal sorgente del parser. Il parser emette un avviso per
          ogni valore diverso da "0" o "0.7.x", raccomandando "0", che viene interpretato
          come l'ultima versione disponibile. Il modulo riuso deve quindi accettare
          repository che dichiarano qualunque versione dell'elenco, non solo l'ultima.

