# ---------------------------------------------------------------- perimetro negativo
# Domini deliberatamente esclusi. Un finding non puo' mai essere emesso su questi temi;
# al massimo compare come promemoria di adempimento in coda al report.
out_of_scope:
  - id: OOS-PROCUREMENT
    reason: "Procedure di gara e valutazione comparativa ex art. 68 CAD: non ancorabili a file:line"
  - id: OOS-DPIA
    reason: "Valutazione d'impatto sulla protezione dei dati: adempimento organizzativo"
  - id: OOS-CONSERVAZIONE
    reason: "Processi di conservazione documentale: organizzativi, non di codice"
  - id: OOS-CLOUD-QUAL
    reason: "Qualificazione dei servizi cloud: procedura amministrativa presso ACN"
  - id: OOS-ATTESTAZIONI
    reason: >
      Attestazioni e dichiarazioni di accessibilita' sottoscritte digitalmente: la skill
      non puo' produrle ne' sostituirle, e non emette mai giudizi di conformita'
