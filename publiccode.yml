  type: community
  contacts:
    - name: "Francesco Del Re"

legal:
  license: EUPL-1.2
  repoOwner: "Francesco Del Re"

localisation:
  localisationReady: false
  availableLanguages:
    - it

description:
  it:
    shortDescription: >-
      Revisione del codice per progetti della Pubblica Amministrazione italiana
      rispetto alle linee guida e agli obblighi del CAD.
    longDescription: >-
      pa-reviewer verifica il codice destinato a enti pubblici italiani rispetto alle
      linee guida nazionali e agli obblighi del Codice dell'Amministrazione Digitale.
      Delega ai validatori ufficiali dove esistono e si concentra su cio' che quelli
      non possono fare: la coerenza fra le autodichiarazioni del progetto e il codice
      effettivo, i domini privi di validatore come il design system, e lo scostamento
      fra specifica di interfaccia e implementazione. Non e' uno strumento di
      certificazione e non emette giudizi di conformita'. Ogni regola e' riconducibile
      a una fonte pubblica registrata, con livello di verifica esplicito.
    features:
      - Verifica di coerenza tra publiccode.yml e codice
      - Delega ai validatori ufficiali dell'ecosistema
      - Registro delle fonti normative verificato in integrazione continua
